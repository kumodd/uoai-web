<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UOAI Third-Party Website SDK Demo</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #0f172a; background: #f8fafc; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
      button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; margin-right: 8px; }
      button.danger { background: #e11d48; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; margin: 8px 0; }
      pre { background: #0f172a; color: #f8fafc; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Third-Party Website Integration Demo (@uoai/sdk)</h1>
    <div class="card">
      <div><strong>Status:</strong> <span id="status">Disconnected</span></div>
      <div style="margin-top: 10px;">
        <button id="btn-connect">Connect to UOAI</button>
        <button id="btn-list" disabled>List Models</button>
      </div>
      <pre id="models-out">Not connected yet.</pre>
    </div>

    <div class="card">
      <label for="prompt">Prompt:</label>
      <textarea id="prompt" rows="3">Write a short introduction to offline AI.</textarea>
      <div>
        <button id="btn-stream" disabled>Stream Completion</button>
        <button id="btn-cancel" class="danger" disabled>Cancel</button>
      </div>
      <pre id="stream-out"></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
