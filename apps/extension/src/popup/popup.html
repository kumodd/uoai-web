<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UOAI — Local AI Provider</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; width: 320px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      .sub { font-size: 12px; color: #94a3b8; margin: 0 0 12px; }
      .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
      .origin { font-family: monospace; font-size: 12px; word-break: break-all; margin: 4px 0 8px; color: #e2e8f0; }
      button { width: 100%; border: 0; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
      .primary { background: #4f46e5; color: #fff; }
      .secondary { background: #334155; color: #f8fafc; }
      .danger { background: #e11d48; color: #fff; }
      .meta { font-size: 11px; color: #cbd5e1; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>Universal Offline AI</h1>
    <p class="sub">Local-Only • 0 Prompts Sent to Cloud</p>
    <div class="card">
      <div class="meta" id="runtime-status">Runtime: checking…</div>
    </div>
    <div class="card" id="site-card">
      <div class="meta">Current website origin:</div>
      <div class="origin" id="site-origin">—</div>
      <div id="site-actions"></div>
    </div>
    <button class="primary" id="open-dashboard">Open UOAI Dashboard</button>
    <button class="secondary" id="open-sidepanel">Open Runtime Side Panel</button>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
